# FROZEN TEST FIXTURE — snapshot of the 2026-07-23 bootstrap seed priors,
# taken immediately BEFORE the first empirical Beta-update fold.
#
# Purpose: Router MACHINERY tests (allocation/optimizer/tracing/route) pin
# their hand-derived arithmetic to THIS file via ROUTER_PRIORS_PATH, so that
# Eval rewriting the live eval/priors_bootstrap.yaml (which is the whole point
# of the file-swappable design) never breaks tests that verify the math, not
# the data. Only test_priors_loading deliberately change-detects the LIVE file.
# DO NOT UPDATE these values when the live file changes — that is the point.

