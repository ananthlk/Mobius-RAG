<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobius Eval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#fafbfc; --card:#ffffff; --card-2:#f4f7fb; --rail:#f1f5f9;
    --line:#e2e8f0; --line-2:#cbd5e1;
    --text:#0f1419; --dim:#5b6675; --faint:#8b95a3;
    --accent:#2563eb; --accent-weak:#dbeafe;
    --run:#0891b2; --run-weak:#cffafe;
    --ok:#059669; --ok-weak:#d1fae5;
    --shadow:0 1px 2px rgba(15,20,25,.06),0 8px 24px rgba(15,20,25,.05);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --ground:#0f1419; --card:#1a2332; --card-2:#161f2c; --rail:#141c28;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#eaf0f7; --dim:#9aa7b6; --faint:#6b7787;
    --accent:#60a5fa; --accent-weak:rgba(96,165,250,.16);
    --run:#22d3ee; --run-weak:rgba(34,211,238,.14);
    --ok:#34d399; --ok-weak:rgba(52,211,153,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --ground:#0f1419; --card:#1a2332; --card-2:#161f2c; --rail:#141c28;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#eaf0f7; --dim:#9aa7b6; --faint:#6b7787;
    --accent:#60a5fa; --accent-weak:rgba(96,165,250,.16);
    --run:#22d3ee; --run-weak:rgba(34,211,238,.14);
    --ok:#34d399; --ok-weak:rgba(52,211,153,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);
    font-family:"DM Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .app-header{background:var(--card);border-bottom:1px solid var(--line)}
  .app-header-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 24px}
  .app-header-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .app-header-brand{display:flex;align-items:center;gap:10px}
  .app-header h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.025em;margin:0}
  .header-module-badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.22);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;position:relative;top:-1px}
  .app-header .subtitle{color:var(--dim);font-size:13px;font-weight:400;margin:0}
  .app-header-right{flex-shrink:0;display:flex;gap:8px}
  .hbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--dim);cursor:pointer;font-size:16px}
  .hbtn:hover{background:var(--card-2);border-color:var(--line-2);color:var(--text)}

  .shell{display:grid;grid-template-columns:var(--rail-w,214px) 1fr;height:calc(100vh - 57px)}
  .shell.collapsed{--rail-w:60px}
  .rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
  .shell.collapsed .nav{font-size:0;justify-content:center;padding:8px 0;gap:0}
  .shell.collapsed .nav .ic{font-size:16px}
  .shell.collapsed .railcap,.shell.collapsed .railfoot,.shell.collapsed .railsep{display:none}
  .nav{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;color:var(--dim);font-size:13.5px;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
  .nav .ic{width:16px;height:16px;flex:none;color:var(--faint)}
  .nav:hover{background:var(--card-2);color:var(--text)}
  .nav.on{background:var(--accent-weak);color:var(--text);font-weight:600}
  .nav.on .ic{color:var(--accent)}
  .railsep{height:1px;background:var(--line);margin:12px 6px}
  .railcap{padding:4px 11px 6px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .railfoot{margin-top:auto;padding:10px 8px 4px;display:flex;flex-direction:column;gap:8px}
  .keyin{width:100%;font-family:"JetBrains Mono",monospace;font-size:11.5px;background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;color:var(--text)}

  .panel{position:relative;min-width:0;background:var(--ground)}
  .panel iframe{width:100%;height:100%;border:0;display:block}
  .panel .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
  .panel.busy .loading{opacity:1}

  @media(max-width:780px){
    .shell{grid-template-columns:1fr;height:auto}
    .rail{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
    .railsep,.railcap,.railfoot{display:none}
    .panel{height:calc(100vh - 120px)}
  }
  svg{display:block}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">
    <div class="app-header-left">
      <button class="hbtn" id="rail-toggle" title="Collapse menu" aria-label="Toggle menu">☰</button>
      <div class="app-header-brand">
        <span class="app-header-logo" style="width:28px;height:28px;border-radius:8px;display:inline-block;background:conic-gradient(from 210deg,var(--accent),var(--run),var(--ok),var(--accent))"></span>
        <h1>Mobius<span class="header-module-badge">Eval</span></h1>
      </div>
      <p class="subtitle" id="crumb">Trace a query</p>
    </div>
    <div class="app-header-right">
      <button class="hbtn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>
<div class="shell" id="shell">
  <nav class="rail">
    <button class="nav" data-view="query"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"/><path d="M10 10l3.5 3.5"/></svg>Trace a query</button>
    <button class="nav" data-view="bank"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 12V4M6 12V7M9.5 12V5M13 12V8.5"/></svg>Run the bank</button>
    <button class="nav" data-view="runs"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.4"/></svg>Runs</button>
    <button class="nav" data-view="calibrate"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13c3-1 4-8 6-8s3 5 6 4"/></svg>Calibrate</button>
    <div class="railsep"></div>
    <div class="railcap">Coming</div>
    <span class="nav" style="opacity:.5;cursor:default"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h4M9 8h4M6 4l-3 4 3 4M10 4l3 4-3 4"/></svg>Compare</span>
    <span class="nav" style="opacity:.5;cursor:default"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12l3-3 2 2 4-5 3 3"/></svg>Trends</span>
    <span class="nav" style="opacity:.5;cursor:default"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v12M2 8h12" stroke-linecap="round"/></svg>Regressions</span>
    <div class="railfoot">
      <input class="keyin" id="admin-key" type="password" placeholder="X-Admin-Key" autocomplete="off">
    </div>
  </nav>
  <section class="panel" id="panel">
    <div class="loading" id="loading">loading…</div>
    <iframe id="frame" title="Eval surface" referrerpolicy="same-origin"></iframe>
  </section>
</div>

<script>
(function(){
  "use strict";
  var KEY_STORAGE='trace_explorer_admin_key', THEME_STORAGE='eval_console_theme', RAIL_STORAGE='eval_console_rail_collapsed';
  var $=function(id){return document.getElementById(id);};
  var _mem={};
  var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return _mem[k]==null?null:_mem[k];}},
             set:function(k,v){try{localStorage.setItem(k,v);}catch(e){_mem[k]=v;}}};

  var VIEWS={
    query:{url:'/eval/query', label:'Trace a query'},
    bank:{url:'/eval/bank', label:'Run the bank'},
    runs:{url:'/eval/runs', label:'Runs'},
    calibrate:{url:'/trace-explorer', label:'Calibrate', external:true}   // old page until a native surface lands
  };
  var DEFAULT='query';
  var frame=$('frame'), panel=$('panel'), current=null;

  // ---- theme + rail (shared with the embedded views via localStorage) ----
  var savedTheme=store.get(THEME_STORAGE); if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
  $('theme-btn').addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    store.set(THEME_STORAGE,next);   // embedded iframes pick this up via their storage listener
  });
  var shellEl=$('shell');
  if(store.get(RAIL_STORAGE)==='1') shellEl.classList.add('collapsed');
  $('rail-toggle').addEventListener('click',function(){var c=shellEl.classList.toggle('collapsed');store.set(RAIL_STORAGE,c?'1':'0');});

  // ---- admin key (one input for the whole portal) ----
  var keyIn=$('admin-key'); keyIn.value=store.get(KEY_STORAGE)||'';
  keyIn.addEventListener('change',function(){ store.set(KEY_STORAGE, keyIn.value.trim()); });

  // ---- view switching ----
  function srcFor(name, qs){
    var v=VIEWS[name]; if(!v) return null;
    if(v.external) return v.url;
    return v.url + (qs && qs.length ? (qs[0]==='?'?qs:'?'+qs) + '&embed=1' : '?embed=1');
  }
  function highlight(name){
    Array.prototype.forEach.call(document.querySelectorAll('.nav[data-view]'),function(b){
      b.classList.toggle('on', b.getAttribute('data-view')===name);
    });
    $('crumb').textContent=(VIEWS[name]||{}).label||'';
  }
  function setView(name, qs, fromHash){
    if(!VIEWS[name]) name=DEFAULT;
    var src=srcFor(name, qs||'');
    current=name;
    highlight(name);
    panel.classList.add('busy');
    frame.src=src;
    if(!fromHash){
      // reflect the view in the URL hash without triggering a reload loop
      var h='#'+name; if(location.hash!==h){ history.replaceState(null,'',h); }
    }
  }
  frame.addEventListener('load',function(){ panel.classList.remove('busy'); });

  // rail clicks
  Array.prototype.forEach.call(document.querySelectorAll('.nav[data-view]'),function(b){
    b.addEventListener('click',function(){ setView(b.getAttribute('data-view'), ''); });
  });

  // in-app navigation bubbled up from an embedded view (row-click, links)
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin) return;
    var d=e.data; if(!d||d.source!=='eval-portal'||!d.nav) return;
    var u=String(d.nav);
    var m=u.match(/^\/eval\/(query|bank|runs)(\?[^#]*)?$/);
    if(m){ setView(m[1], m[2]||''); }
    else if(u.indexOf('/trace-explorer')===0){ setView('calibrate',''); }
  });

  // hash routing (deep-link / back-forward)
  window.addEventListener('hashchange',function(){
    var name=(location.hash||'').replace(/^#/,'').split('?')[0];
    if(name && name!==current) setView(name, '', true);
  });

  // ---- boot ----
  var initHash=(location.hash||'').replace(/^#/,'').split('?')[0];
  setView(initHash || DEFAULT, '', true);
})();
</script>
</body>
</html>
