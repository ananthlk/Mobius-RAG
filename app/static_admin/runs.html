<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eval Console · Runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ---- tokens: light default, dark via prefers-color-scheme + [data-theme] ---- */
  :root{
    --ground:#fafbfc; --card:#ffffff; --card-2:#f4f7fb; --rail:#f1f5f9;
    --line:#e2e8f0; --line-2:#cbd5e1;
    --text:#0f1419; --dim:#5b6675; --faint:#8b95a3;
    --accent:#2563eb; --accent-weak:#dbeafe;
    --run:#0891b2; --run-weak:#cffafe;
    --ok:#059669; --ok-weak:#d1fae5;
    --ack:#b45309; --ack-weak:#fef3c7;
    --bad:#dc2626; --bad-weak:#fee2e2;
    --shadow:0 1px 2px rgba(15,20,25,.06),0 8px 24px rgba(15,20,25,.05);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --ground:#0f1419; --card:#1a2332; --card-2:#161f2c; --rail:#141c28;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#eaf0f7; --dim:#9aa7b6; --faint:#6b7787;
    --accent:#60a5fa; --accent-weak:rgba(96,165,250,.16);
    --run:#22d3ee; --run-weak:rgba(34,211,238,.14);
    --ok:#34d399; --ok-weak:rgba(52,211,153,.15);
    --ack:#fbbf24; --ack-weak:rgba(251,191,36,.15);
    --bad:#f87171; --bad-weak:rgba(248,113,113,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --ground:#0f1419; --card:#1a2332; --card-2:#161f2c; --rail:#141c28;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#eaf0f7; --dim:#9aa7b6; --faint:#6b7787;
    --accent:#60a5fa; --accent-weak:rgba(96,165,250,.16);
    --run:#22d3ee; --run-weak:rgba(34,211,238,.14);
    --ok:#34d399; --ok-weak:rgba(52,211,153,.15);
    --ack:#fbbf24; --ack-weak:rgba(251,191,36,.15);
    --bad:#f87171; --bad-weak:rgba(248,113,113,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .shell{display:grid;grid-template-columns:214px 1fr;min-height:100vh}
  /* ---- rail ---- */
  .rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;
    display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 10px 16px}
  .brand .mk{width:22px;height:22px;border-radius:6px;
    background:conic-gradient(from 210deg,var(--accent),var(--run),var(--ok),var(--accent))}
  .brand b{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .nav{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
    color:var(--dim);font-size:13.5px;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
  .nav .ic{width:16px;height:16px;flex:none;color:var(--faint)}
  .nav:hover{background:var(--card-2);color:var(--text)}
  .nav.on{background:var(--accent-weak);color:var(--text);font-weight:600}
  .nav.on .ic{color:var(--accent)}
  .nav .badge{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
    padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
  .nav .badge.run{background:var(--run-weak);color:var(--run)}
  .nav .badge.ack{background:var(--ack-weak);color:var(--ack)}
  .railsep{height:1px;background:var(--line);margin:12px 6px}
  .railcap{padding:4px 11px 6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .railfoot{margin-top:auto;padding:10px 8px 4px;display:flex;flex-direction:column;gap:8px}
  .keyin{width:100%;font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--card);
    border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;color:var(--text)}
  .themebtn{font-size:11.5px;color:var(--dim);background:var(--card);border:1px solid var(--line-2);
    border-radius:8px;padding:6px 9px;cursor:pointer}

  /* ---- main ---- */
  .main{padding:26px 30px 60px;max-width:1080px}
  .maintop{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .maintop h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0}
  .maintop .sub{color:var(--faint);font-size:12.5px;margin-top:3px}
  .livepill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);
    background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
  .beacon{width:8px;height:8px;border-radius:99px;background:var(--faint);position:relative;flex:none}
  .beacon.live{background:var(--ok)} .beacon.busy{background:var(--run)}
  .beacon.live::after,.beacon.busy::after{content:"";position:absolute;inset:-4px;border-radius:99px;
    border:2px solid currentColor;color:inherit;opacity:.5;animation:ping 1.8s ease-out infinite}
  .beacon.live::after{border-color:var(--ok)} .beacon.busy::after{border-color:var(--run)}
  @keyframes ping{0%{transform:scale(.6);opacity:.55}80%,100%{transform:scale(1.5);opacity:0}}
  @media (prefers-reduced-motion:reduce){.beacon::after{animation:none}}

  .answer{margin:18px 0;border-radius:12px;border:1px solid var(--line-2);background:var(--card);
    padding:15px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .answer.busy{border-color:var(--run);background:var(--run-weak)}
  .answer.idle{border-color:var(--ok);background:var(--ok-weak)}
  .answer .big{font-size:15px;font-weight:600}
  .answer .big em{font-style:normal}
  .answer.busy .big em{color:var(--run)} .answer.idle .big em{color:var(--ok)}
  .answer .meta{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);text-align:right}

  .toolbar{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  .toolbar .seg{display:flex;gap:4px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .toolbar .seg button{font-size:12px;color:var(--dim);background:none;border:0;border-radius:6px;padding:5px 11px;cursor:pointer}
  .toolbar .seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
  .toolbar .sp{flex:1}
  .toolbar .lnk{font-size:12.5px;font-weight:600}

  .runs{display:flex;flex-direction:column;gap:10px}
  .run{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;
    padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
  .run .stripe{align-self:stretch;border-radius:99px;background:var(--line-2)}
  .run.s-run .stripe{background:var(--run)} .run.s-ok .stripe{background:var(--ok)}
  .run.s-ack .stripe{background:var(--ack)} .run.s-bad .stripe{background:var(--bad)}
  .run .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .run .jid{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);font-weight:500}
  .run .line{color:var(--dim);font-size:12.5px;margin-top:5px;font-family:"IBM Plex Mono",monospace}
  .run .line .m{color:var(--text)} .run .line .sep{color:var(--faint);margin:0 6px}
  .chip{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px;letter-spacing:.03em;white-space:nowrap}
  .chip.run{background:var(--run-weak);color:var(--run)}
  .chip.ok{background:var(--ok-weak);color:var(--ok)}
  .chip.ack{background:var(--ack-weak);color:var(--ack)}
  .chip.bad{background:var(--bad-weak);color:var(--bad)}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px;width:min(280px,42vw)}
  .bar i{display:block;height:100%;background:var(--run);border-radius:99px;transition:width .4s ease}
  .act{display:flex;gap:7px;align-items:center}
  .btn{font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 13px;border:1px solid var(--line-2);
    background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.p:hover{color:#fff;opacity:.92}
  .btn.a{background:var(--ack-weak);border-color:var(--ack);color:var(--ack)}
  .btn.a:hover{color:var(--ack);opacity:.9}

  .empty{padding:40px 20px;text-align:center;color:var(--dim);border:1px dashed var(--line-2);border-radius:12px}
  .empty b{color:var(--text)}
  .note{font-size:11.5px;color:var(--faint);margin-top:18px;font-family:"IBM Plex Mono",monospace}

  /* toast stack */
  .toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:50;max-width:360px}
  .toast{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ok);
    border-left:4px solid var(--ok);border-radius:11px;padding:12px 14px;box-shadow:var(--shadow);
    animation:slidein .25s ease}
  .toast.bad{border-color:var(--bad);border-left-color:var(--bad)}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .toast .tk{width:26px;height:26px;border-radius:8px;background:var(--ok-weak);color:var(--ok);display:grid;place-items:center;flex:none}
  .toast.bad .tk{background:var(--bad-weak);color:var(--bad)}
  .toast .tt{font-size:13px;font-weight:600} .toast .td{font-size:11.5px;color:var(--dim);margin-top:2px;font-family:"IBM Plex Mono",monospace}
  .toast .tb{margin-left:auto;display:flex;gap:6px}
  .toast .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:16px;padding:2px 4px}

  @media(max-width:780px){
    .shell{grid-template-columns:1fr}
    .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
    .brand{width:100%}.railsep,.railcap,.railfoot{display:none}
  }
  svg{display:block}
</style>
</head>
<body>
<div class="shell">
  <!-- ============ left rail ============ -->
  <nav class="rail">
    <div class="brand"><span class="mk"></span><b>Eval Console</b></div>
    <a class="nav" href="/trace-explorer"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 8l6-5 6 5M4 7v6h8V7"/></svg>Overview</a>
    <a class="nav" href="/trace-explorer"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"/><path d="M10 10l3.5 3.5"/></svg>Trace a query</a>
    <a class="nav" href="/trace-explorer"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 12V4M6 12V7M9.5 12V5M13 12V8.5"/></svg>Run the bank</a>
    <button class="nav on"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.4"/></svg>Runs<span class="badge run" id="nav-run-badge" hidden>0</span></button>
    <a class="nav" href="/trace-explorer"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h4M9 8h4M6 4l-3 4 3 4M10 4l3 4-3 4"/></svg>Compare</a>
    <a class="nav" href="/trace-explorer"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13c3-1 4-8 6-8s3 5 6 4"/></svg>Calibrate<span class="badge ack" id="nav-ack-badge" hidden>0</span></a>
    <div class="railsep"></div>
    <div class="railcap">Coming</div>
    <span class="nav" style="opacity:.5;cursor:default"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12l3-3 2 2 4-5 3 3"/></svg>Trends</span>
    <span class="nav" style="opacity:.5;cursor:default"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v12M2 8h12" stroke-linecap="round"/></svg>Regressions</span>
    <div class="railfoot">
      <input class="keyin" id="admin-key" type="password" placeholder="X-Admin-Key" autocomplete="off">
      <button class="themebtn" id="theme-btn">Toggle theme</button>
    </div>
  </nav>

  <!-- ============ main ============ -->
  <main class="main">
    <div class="maintop">
      <div>
        <h1>Runs</h1>
        <div class="sub">Everything that&rsquo;s running, queued, or finished &mdash; one list, live.</div>
      </div>
      <span class="livepill"><span class="beacon" id="live-beacon"></span> <span id="live-label">connecting&hellip;</span></span>
    </div>

    <div class="answer" id="answer">
      <div class="big" id="answer-text">Checking what&rsquo;s running&hellip;</div>
      <div class="meta" id="answer-meta"></div>
    </div>

    <div class="toolbar">
      <div class="seg" id="filter-seg">
        <button data-f="all" class="on">All</button>
        <button data-f="running">Running</button>
        <button data-f="unackd">Needs ack</button>
        <button data-f="done">Done</button>
      </div>
      <div class="sp"></div>
      <button class="btn" id="refresh-btn">Refresh</button>
      <a class="lnk" href="/trace-explorer">Start a run &rarr;</a>
    </div>

    <div class="runs" id="runs"></div>
    <div class="note" id="foot-note"></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
  "use strict";
  var KEY_STORAGE = 'trace_explorer_admin_key';   // shared with /trace-explorer
  var ACK_STORAGE = 'eval_runs_acked';            // client-side ack (P0)
  var THEME_STORAGE = 'eval_console_theme';
  var POLL_MS = 4000;

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  // Safe storage: some contexts (private mode, sandboxed/data: iframes)
  // throw on localStorage access. Degrade to in-memory rather than crash.
  var _mem = {};
  var store = {
    get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return _mem[k]==null?null:_mem[k]; } },
    set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _mem[k]=v; } }
  };

  // ---- admin key ----
  var keyIn = $('admin-key');
  keyIn.value = store.get(KEY_STORAGE) || '';
  keyIn.addEventListener('change', function(){
    store.set(KEY_STORAGE, keyIn.value.trim());
    load();
  });
  function authHeaders(){ var k = keyIn.value.trim(); return k ? {'X-Admin-Key': k} : {}; }

  // ---- theme ----
  var saved = store.get(THEME_STORAGE);
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  $('theme-btn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    store.set(THEME_STORAGE, next);
  });

  // ---- ack state (client-side; server-persisted ack is a follow-up) ----
  function ackSet(){ try{ return new Set(JSON.parse(store.get(ACK_STORAGE)||'[]')); }catch(e){ return new Set(); } }
  function saveAck(set){ store.set(ACK_STORAGE, JSON.stringify(Array.prototype.slice.call(set))); }
  function acknowledge(jobId){ var s = ackSet(); s.add(jobId); saveAck(s); render(); }

  // ---- score cache + bounded queue --------------------------------------
  // /list carries no scores, so each finished run needs a /status call to
  // show answer/retrieval/authority. But /status fetches the full run body,
  // and the API is min=max=1 — firing one per finished run (135 of them)
  // would saturate the single instance (exactly the contention the sprint
  // warns about). So: fetch scores ONLY for visible rows, at most
  // SCORE_MAX_INFLIGHT at a time, capped to SCORE_CAP per view.
  var scoreCache = {};   // job_id -> {recall, recall_answer, authority} | 'pending' | 'err'
  var scoreQueue = [], scoreInflight = 0;
  var SCORE_MAX_INFLIGHT = 2, SCORE_CAP = 12;
  function scheduleScores(visibleFinished){
    visibleFinished.slice(0, SCORE_CAP).forEach(function(jobId){
      if(scoreCache[jobId] || scoreQueue.indexOf(jobId) !== -1) return;
      scoreQueue.push(jobId);
    });
    pumpScores();
  }
  function pumpScores(){
    while(scoreInflight < SCORE_MAX_INFLIGHT && scoreQueue.length){
      var jobId = scoreQueue.shift();
      if(scoreCache[jobId]) continue;
      scoreCache[jobId] = 'pending';
      scoreInflight++;
      (function(id){
        fetch('/admin/trace-explorer/run-bank/status?job_id='+encodeURIComponent(id), {headers: authHeaders()})
          .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function(st){
            var sums = (st.summaries||[]).filter(function(s){ return s.status !== 'error'; });
            var avg = function(k){ var v = sums.filter(function(s){return s[k]!=null;}); return v.length ? v.reduce(function(a,s){return a+s[k];},0)/v.length : null; };
            scoreCache[id] = { recall: avg('recall'), recall_answer: avg('recall_answer'), authority: avg('authority_score') };
          })
          .catch(function(){ scoreCache[id] = 'err'; })
          .then(function(){ scoreInflight--; pumpScores(); render(); });
      })(jobId);
    }
  }

  // ---- elapsed formatting ----
  function since(ts){
    if(!ts) return null;
    var t = Date.parse(ts); if(isNaN(t)) return null;
    var s = Math.max(0, Math.floor((Date.now()-t)/1000));
    if(s < 60) return s+'s';
    if(s < 3600) return Math.floor(s/60)+'m '+(s%60)+'s';
    return Math.floor(s/3600)+'h '+Math.floor((s%60/60?0:(s%3600)/60))+'m';
  }
  function pct01(x){ return x==null ? '—' : (Math.round(x*100)/100).toFixed(2); }
  // started_at in the API is not a wall-clock timestamp (it's a monotonic
  // value); `updated` may be a real date. Show a "when" only if parseable —
  // never render a raw number as if it were a time.
  function whenStr(r){
    var raw = r.updated || '';
    var t = Date.parse(raw);
    if(isNaN(t)) return null;
    var ago = since(new Date(t).toISOString());
    return ago ? ago + ' ago' : null;
  }
  function modeStr(r){ return r.caller_mode ? esc(r.caller_mode) : ''; }

  // ---- state ----
  var runs = [];          // from /list
  var lastStatus = {};     // job_id -> status, to detect running->done transitions
  var seededTransitions = false;
  var filter = 'all';
  var lastError = null;
  var lastPolledAt = null;

  // ---- fetch list ----
  function load(){
    fetch('/admin/trace-explorer/run-bank/list', {headers: authHeaders()})
      .then(function(r){
        if(r.status === 401 || r.status === 403){ throw {kind:'auth', code:r.status}; }
        if(!r.ok){ throw {kind:'http', code:r.status}; }
        return r.json();
      })
      .then(function(d){
        lastError = null;
        lastPolledAt = new Date();
        var incoming = d.runs || [];
        detectFinishes(incoming);
        runs = incoming;
        render();   // render() schedules bounded score fetches for the VISIBLE rows only
      })
      .catch(function(e){
        lastError = e && e.kind ? e : {kind:'net'};
        render();
      });
  }

  function detectFinishes(incoming){
    var acked = ackSet();
    incoming.forEach(function(r){
      var prev = lastStatus[r.job_id];
      if(seededTransitions && prev === 'running' && r.status && r.status !== 'running'){
        if(r.status === 'error'){
          toast('bad', 'Run failed', esc(r.name || r.job_id));
        } else if(!acked.has(r.job_id)){
          toast('ok', 'Run finished — ' + (r.name || r.job_id),
                (r.done!=null?r.done:'?') + '/' + (r.total!=null?r.total:'?') + ' · acknowledge to clear', r.job_id);
        }
      }
      lastStatus[r.job_id] = r.status;
    });
    seededTransitions = true;
  }

  // ---- toasts ----
  function toast(kind, title, detail, jobId){
    var wrap = $('toasts');
    var el = document.createElement('div');
    el.className = 'toast' + (kind==='bad'?' bad':'');
    var icon = kind==='bad'
      ? '<path d="M8 5v4M8 11.5h.01M8 2L1 14h14L8 2z"/>'
      : '<path d="M3.5 8.5l3 3 6-7"/>';
    el.innerHTML =
      '<div class="tk"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">'+icon+'</svg></div>'+
      '<div><div class="tt">'+esc(title)+'</div><div class="td">'+esc(detail||'')+'</div></div>'+
      '<div class="tb">'+ (jobId ? '<button class="btn a" data-ack="'+esc(jobId)+'">Acknowledge</button>' : '') +
      '<button class="x" aria-label="dismiss">&times;</button></div>';
    el.querySelector('.x').addEventListener('click', function(){ el.remove(); });
    var ackBtn = el.querySelector('[data-ack]');
    if(ackBtn) ackBtn.addEventListener('click', function(){ acknowledge(jobId); el.remove(); });
    wrap.appendChild(el);
    if(kind !== 'bad') setTimeout(function(){ if(el.parentNode) el.remove(); }, 12000);
  }

  // ---- derive a display state per run ----
  function displayState(r, acked){
    if(r.status === 'running') return 'run';
    if(r.status === 'error') return 'bad';
    if(!acked.has(r.job_id)) return 'ack';   // done but unacknowledged
    return 'ok';
  }

  // ---- render ----
  function render(){
    var acked = ackSet();
    var running = runs.filter(function(r){ return r.status === 'running'; });
    var unackd = runs.filter(function(r){ return r.status && r.status !== 'running' && r.status !== 'error' && !acked.has(r.job_id); });

    // live pill + beacon
    var beacon = $('live-beacon'), label = $('live-label');
    if(lastError){
      beacon.className = 'beacon';
      label.textContent = lastError.kind === 'auth' ? 'admin key needed' : (lastError.kind === 'net' ? 'offline' : 'error '+(lastError.code||''));
    } else {
      beacon.className = 'beacon ' + (running.length ? 'busy' : 'live');
      label.textContent = running.length ? 'live · ' + running.length + ' running' : 'live · idle';
    }

    // nav badges
    setBadge('nav-run-badge', running.length, 'run');

    // answer banner
    var ans = $('answer'), at = $('answer-text'), am = $('answer-meta');
    if(lastError && lastError.kind === 'auth'){
      ans.className = 'answer';
      at.innerHTML = 'Enter your <b>X-Admin-Key</b> (bottom-left) to see runs.';
      am.textContent = '';
    } else if(lastError){
      ans.className = 'answer';
      at.innerHTML = lastError.kind === 'net' ? 'Can&rsquo;t reach the API.' : ('API error ' + esc(lastError.code||''));
      am.textContent = 'retrying every ' + (POLL_MS/1000) + 's';
    } else if(running.length){
      ans.className = 'answer busy';
      at.innerHTML = 'Yes &mdash; <em>' + running.length + ' job' + (running.length>1?'s':'') + ' running</em>' +
        (unackd.length ? ', ' + unackd.length + ' waiting to be acknowledged.' : '.');
      am.innerHTML = 'polled ' + (since(lastPolledAt.toISOString())||'now') + ' ago<br>auto-refresh ' + (POLL_MS/1000) + 's';
    } else {
      ans.className = 'answer idle';
      at.innerHTML = unackd.length
        ? 'Nothing running &mdash; <em>' + unackd.length + ' finished run' + (unackd.length>1?'s':'') + ' to acknowledge.</em>'
        : 'Nothing running. <em>All clear.</em>';
      am.innerHTML = lastPolledAt ? ('polled ' + (since(lastPolledAt.toISOString())||'now') + ' ago') : '';
    }

    // filter + rows
    var filtered = runs.filter(function(r){
      if(filter === 'running') return r.status === 'running';
      if(filter === 'done') return r.status && r.status !== 'running';
      if(filter === 'unackd') return unackd.indexOf(r) !== -1;
      return true;
    });
    var MAX_ROWS = 60;
    var list = filtered.slice(0, MAX_ROWS);
    var truncated = filtered.length - list.length;

    var wrap = $('runs');
    if(lastError && lastError.kind === 'auth'){ wrap.innerHTML = ''; $('foot-note').textContent=''; return; }
    if(!runs.length){
      wrap.innerHTML = '<div class="empty"><b>No runs yet.</b><br>Start one from <a href="/trace-explorer">Run the bank</a> and it&rsquo;ll appear here live.</div>';
      $('foot-note').textContent = '';
      return;
    }
    wrap.innerHTML = list.map(function(r){ return rowHtml(r, acked); }).join('');
    // wire buttons
    wrap.querySelectorAll('[data-ack]').forEach(function(b){
      b.addEventListener('click', function(){ acknowledge(b.getAttribute('data-ack')); });
    });

    // fetch scores ONLY for the finished rows now on screen, bounded
    scheduleScores(list.filter(function(r){ return r.status && r.status !== 'running'; })
                       .map(function(r){ return r.job_id; }));

    $('foot-note').innerHTML = 'Live from <span class="mono">/admin/trace-explorer/run-bank/list</span> · '+
      (truncated>0 ? 'showing '+list.length+' of '+filtered.length+' (newest first) · ' : '')+
      'acknowledgements are stored in this browser (server-persisted ack is a follow-up).';
  }

  function setBadge(id, n, cls){
    var el = $(id); if(!el) return;
    if(n>0){ el.textContent = n; el.hidden = false; } else { el.hidden = true; }
  }

  function rowHtml(r, acked){
    var st = displayState(r, acked);
    var chip = st==='run' ? '<span class="chip run">RUNNING</span>'
             : st==='bad' ? '<span class="chip bad">FAILED</span>'
             : st==='ack' ? '<span class="chip ack">DONE · UNACK&rsquo;D</span>'
             : '<span class="chip ok">DONE</span>';
    var name = r.name
      ? '<b>'+esc(r.name)+'</b> <span class="jid">'+esc(r.job_id)+'</span>'
      : '<span class="jid">'+esc(r.job_id)+' <i>(unnamed)</i></span>';
    var strat = esc(r.forced_strategy || 'auto') + (r.allocator_override ? ' · '+esc(r.allocator_override) : '');
    var done = (r.done!=null?r.done:'?'), total = (r.total!=null?r.total:'?');

    // line + optional progress / scores
    var line, extra = '';
    var mode = modeStr(r), when = whenStr(r);
    var modeClause = mode ? '<span class="sep">·</span>'+mode : '';
    var whenClause = when ? '<span class="sep">·</span>'+when : '';
    if(st==='run'){
      var frac = (r.total>0 && r.done!=null) ? Math.min(1, r.done/r.total) : 0;
      line = '<span class="m">'+done+' / '+total+'</span><span class="sep">·</span>'+strat+modeClause;
      extra = '<div class="bar"><i style="width:'+(frac*100).toFixed(0)+'%"></i></div>';
    } else {
      var sc = scoreCache[r.job_id];
      var scoreStr = (sc && sc !== 'pending' && sc !== 'err')
        ? '<span class="sep">·</span>answer <span class="m">'+pct01(sc.recall_answer)+'</span>'+
          '<span class="sep">·</span>retrieval <span class="m">'+pct01(sc.recall)+'</span>'+
          (sc.authority!=null ? '<span class="sep">·</span>auth <span class="m">'+Math.round(sc.authority*100)+'%</span>' : '')
        : (sc === 'pending' ? '<span class="sep">·</span><span style="color:var(--faint)">scoring…</span>' : '');
      line = done+' / '+total+'<span class="sep">·</span>'+strat + modeClause + scoreStr + whenClause;
    }

    var actions = st==='run'
      ? '<a class="btn p" href="/trace-explorer?job_id='+encodeURIComponent(r.job_id)+'">Watch</a>'
      : st==='ack'
        ? '<button class="btn a" data-ack="'+esc(r.job_id)+'">Acknowledge</button>'+
          '<a class="btn" href="/trace-explorer?job_id='+encodeURIComponent(r.job_id)+'">Open</a>'
        : '<a class="btn" href="/trace-explorer?job_id='+encodeURIComponent(r.job_id)+'">Open</a>';

    return '<div class="run s-'+st+'">'+
      '<div class="stripe"></div>'+
      '<div><div class="name">'+name+' '+chip+'</div>'+
        '<div class="line">'+line+'</div>'+extra+'</div>'+
      '<div class="act">'+actions+'</div>'+
    '</div>';
  }

  // ---- filter seg ----
  $('filter-seg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); });
    render();
  });
  $('refresh-btn').addEventListener('click', load);

  // ---- boot ----
  render();
  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
