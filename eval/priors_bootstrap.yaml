# Bootstrap Seed Priors for Router (depth_bucket × strategy)
# Generated 2026-07-23 from legacy qclass-based priors
# Graduated scale: 60% at depth 0 → 95% at depth 4
#
# Timeline:
#   Week 1: seed active, calibration loop ingests depth_bucket tuples
#   Week 2-3: empirical priors derived once N≥50 samples per cell
#   Week 3+: production-grade depth_bucket priors replace seeds, fallback to qclass optional
#
# cost_per_attempt = 0 across ALL strategies (Ananth, 2026-07-26): confirmed
# these cost values were never derived from real calibration -- same seed-data
# status as accuracy_estimate/recall_lift below. Zeroing removes an
# unvalidated tie-breaker from the LB-maximizer's argmax (allocation.py/
# optimizer.py: required slots break ties on (lb, confidence, -cost, -latency)
# -- cost no longer participates while it's fabricated). Re-derivation of
# accuracy_estimate/recall_lift from REAL forced-arm conditional recall (only
# cells where a strategy actually deployed, not the marginal/empty-counts-as-0
# basis) is in progress -- see docs/rag-agents/d-starvation-causes.md and the
# 2026-07-26 forced-arm K-curve re-run.
#
# SEMANTIC NOTE on strategy 's' (payor fact store), 2026-07-24 (Eval):
#   s's accuracy_estimate here means "P(the returned certified fact is CORRECT)"
#   — NOT "P(the query is ANSWERED)". s returns a single stored fact (payer ID,
#   timely-filing number) when the query maps to one, and nothing usable otherwise.
#   So .45-.5 is a high-conditional-accuracy number that does NOT make s a general
#   direct_answer strategy; on content queries s returns a bare code, not an answer.
#   This over-reads as general strategic value to any consumer that treats the cell
#   as P(answered) — the reason greedy/optimizer collapsed to ['s'] at max_attempts=1
#   (fixed structurally by Router's SUPPLEMENT_ONLY gate: s may never be the sole
#   rung of a required content slot while anything else is viable). Do NOT "correct"
#   these values by hand — do-not-fold stands until a real payor-weighted bank
#   calibrates s; the gate makes the values non-load-bearing for the collapse anyway.
#   When that bank exists, s's cell should split fact-shaped vs content-shaped queries
#   (it currently averages two very different populations).
#
# SEMANTIC NOTE on strategy 'd' (web search), 2026-07-26 (Eval):
#   d's cell population is "P(success) over ALL queries d runs on" — NO
#   crawlability conditioning. The crawl gate was DISABLED 2026-07-24
#   (CRAWL_GATED_STRATEGIES=frozenset() in allocation.py): d is general web
#   search that surfaces third-party sources regardless of whether a payor's
#   OWN site is crawlable, so payer_crawlable no longer excludes d. Any future
#   d calibration must NOT inherit the old "P(success | not affirmatively
#   non-crawlable)" conditioning — d now executes on crawlable=False queries
#   too, a broader population. Also: historical crawlable=False labels were
#   partly a mobius-payor/robots.py cache-poisoning artifact (one transient
#   failure froze crawlable=False process-lifetime, no TTL — Sitemap
#   root-caused, fixed separately), so pre-fix crawlability-conditioned d data
#   is doubly untrustworthy. latency_p50_ms=4000 is WARM marginal (see cell
#   comment); do-not-fold on values stands.

# allocator_weights: Eval-owned code-free cutover (dispatch.py reads
# exploration_policy.allocator_weights). Deterministic weighted draw picks ONE
# allocator to EXECUTE per production query; untaken allocators log SHADOW plans
# only (plan-diagnostics, NO executed-outcome attribution — dispatch.py §6b).
# PINNED TO GREEDY 2026-08-06 (Ananth via Retriever, Eval sign-off): greedy is
# validated (2026-08-06 mode×authority_requirement matrix; citable→b confirms the
# ship-gate mechanism on the real allocator). optimizer/bayesian held at 0.0 —
# they must clear their OWN forced eval-bank validation (the same bar greedy
# cleared) before any promotion; until then they shadow-compute (decision
# distribution accrues) but never serve real users. This SUPERSEDES the bootstrap
# equal-thirds default (priors.py:219), which executed all three at 1/3 —
# i.e. served UNVALIDATED allocators to 2/3 of production traffic. Validate-then-
# serve, not serve-all-and-compare. Raise a weight only after that allocator
# passes its forced-matrix validation (Eval sign-off).
exploration_policy:
  allocator_weights:
    greedy: 1.0
    optimizer: 0.0
    bayesian: 0.0

