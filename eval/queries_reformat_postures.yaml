bank_version: reformat_postures_v1
# v1 (2026-07-23): co-authored by EVAL + Shape-Reformat Agent
# REVISED 2026-07-23: adopted vector-based theme clustering per Ananth's correction.
# Purpose: exercise Reformat's 6-posture mapping (PRECISE, FAN_OUT, CLARIFY,
# RELY_ON_EXTERNAL×2, DECLINE). Each test case pairs a Gate contour result
# with expected Reformat behavior.
#
# MECHANISM CHANGE from draft: FAN_OUT no longer ranks individual fanout_codes.
# Instead: embed fanout_codes' lexicon phrases → cluster into 3-4 *themes* by vector
# similarity → rank themes (w_p·prevalence + w_l·lexicon_proximity) → take top-3
# themes → one rewritten query per theme. This avoids redundant near-duplicate queries
# (e.g., eligibility.aged + eligibility.blind both in "disability-related eligibility"
# theme, fanned as one query, not two).
#
# Distinct purpose from queries_gate_contours.yaml: Gate tests CLASSIFICATION,
# Reformat tests TRANSFORMATION. A single Gate result (e.g., EXACT, UNDERSPECIFIED,
# VICINITY) flows through Reformat into a posture + rewritten_queries[].
#
# Test structure: given gate_result (contour + codes + fanout_codes), verify that
# reformat(.) produces the expected posture and rewritten_queries have right shape/count.
# For FAN_OUT cases: verify theme clustering + ranking is correct (score ordering at
# theme level, not code level; top-3 themes by score; one query per theme).
#
# Built jointly: Shape-Reformat (queries, live verification) + Eval (test design,
# scoring criteria, see this doc §6 for scoring guidelines).
queries:

# --- PRECISE posture: EXACT contour, pass-through ---
- id: reformat001
  query: How do I confirm eligibility for Medicaid
  gate_contour: exact
  gate_codes:
    d_codes: [verification.confirm]
    j_codes: [program.medicaid]
    p_codes: [verification.verify]
  expected_posture: precise
  expected_rewritten_query_count: 1
  notes: >
    EXACT gate result → PRECISE posture → one rewritten query (normalized original).
    No fanout, no clarification needed. Posture mapping is trivial here; test
    verifies the pass-through is wired correctly.

- id: reformat002
  query: What's the process to resubmit a denied claim with Molina
  gate_contour: exact
  gate_codes:
    d_codes: [process_action.deny_handling]
    j_codes: [payor.molina]
    p_codes: [process_action.remedial]
  expected_posture: precise
  expected_rewritten_query_count: 1
  notes: >
    EXACT gate result with both D and J specific. Posture stays PRECISE.

# --- FAN_OUT posture: UNDERSPECIFIED/explore_siblings, bounded ranked expansion ---
- id: reformat003
  query: Eligibility for Medicaid
  gate_contour: underspecified
  underspecified_kind: explore_siblings
  gate_codes:
    d_codes: [eligibility]  # The bare umbrella
    j_codes: [program.medicaid]
    p_codes: []
  fanout_codes: [
    "eligibility.aged",
    "eligibility.blind",
    "eligibility.disability",
    "eligibility.pregnancy",
    "eligibility.income",
    "eligibility.categorical",
    "eligibility.medical_necessity",
    "eligibility.enrollment",
    "eligibility.verification",
    "eligibility.waiver",
    "eligibility.chip_related",
    "eligibility.immigrant_status",
    "eligibility.citizenship",
    "eligibility.residency",
  ]  # Real ~80 siblings from live corpus
  expected_posture: fan_out
  expected_rewritten_query_count: 3  # N=3 themes (hard cap at 4, target 3)
  expected_themes: [
    {name: "enrollment_status", member_count: 31, doc_count: 3307},
    {name: "income_eligibility", member_count: 32, doc_count: 1487},
    {name: "age_range", member_count: 17, doc_count: 154},
  ]  # Live run 2026-07-23, k-means clustering (spherical, cosine similarity)
  notes: >
    UNDERSPECIFIED/explore_siblings gate result → FAN_OUT posture.
    Gate provides ~80 fanout_codes from eligibility.* universe.
    Reformat embeds fanout_codes' policy_lexicon_entries phrases, clusters by vector
    similarity using k-means (spherical, cosine) into ~3-4 themes. Scores each *theme*
    (not individual code) by w_p·prevalence + w_l·lexicon_proximity, ranks descending,
    takes top-3 themes. One rewritten_queries per theme.

    **LIVE RUN VERIFIED (2026-07-23):** 80 codes → 3 themes (enrollment_status, income,
    age_range), semantically coherent. Theme members balanced (31/32/17), not a single
    mega-cluster (unlike average-linkage's chaining failure on same-domain embeddings).
    Proposed w_p=0.4/w_l=0.6 used as-is; no re-tuning needed yet for this case.

    TEST VALIDATION: verify theme clustering produces semantically distinct angles
    (not random code groupings); membership distribution is balanced (not 79/1 clusters);
    top-3 by hybrid score cover the major user-intent facets for "eligibility" without
    redundant near-duplicates.

- id: reformat004
  query: Behavioral health services for Medicaid
  gate_contour: exact  # Note: this is EXACT, not underspecified (§4b surprise finding from Gate bank)
  gate_codes:
    d_codes: [health_care_services.behavioral_health]  # Specific leaf, not bare umbrella
    j_codes: [program.medicaid]
    p_codes: []
  expected_posture: precise
  expected_rewritten_query_count: 1
  notes: >
    Gate found this is a specific leaf (d:health_care_services.behavioral_health),
    not the bare umbrella that would cause underspecified→explore_siblings.
    So Reformat treats it as PRECISE. Included here to document: gate's finding
    that phrase-specific matching can resolve even large umbrellas (631 siblings for
    bare health_care_services, but "behavioral health" is specific enough).

- id: reformat005
  query: How do I get hospice services
  gate_contour: underspecified
  underspecified_kind: missing_jurisdiction
  gate_codes:
    d_codes: [health_care_services.hospice]  # Live Gate resolved to specific leaf, not bare umbrella
    j_codes: []  # No payer/state specified
    p_codes: []
  expected_posture: clarify
  expected_clarify_questions_count: "1+"
  notes: >
    **LIVE RUN CORRECTION (2026-07-23):** Bank assumed "hospice services" would match
    the bare `health_care_services` umbrella (631+ siblings), triggering explore_siblings.
    Live Gate instead resolves D directly to the specific leaf `health_care_services.hospice`
    — the lexicon phrase "hospice" is specific enough to match a leaf, not the parent.
    With D resolved (specific leaf) and J empty, the real contour is
    `underspecified/missing_jurisdiction`, and Reformat correctly produces CLARIFY posture.

    **This is not a Reformat bug — it's a bank-authoring discovery:** queries specific
    enough to match a leaf (like "hospice services") won't hit the bare umbrella, so
    they can't test FAN_OUT on huge fanoust. We still need a test case that hits the
    bare umbrella (health_care_services without domain hints); candidates: "What healthcare
    is covered?", "Which services are available?", "Tell me about Medicaid benefits"
    (TBD, verify live before adding).

