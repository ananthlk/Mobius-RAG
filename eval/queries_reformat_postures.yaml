## §6 Scoring criteria + tuning questions (EVAL-OWNED)

### Hybrid scoring function (theme-level)
**REVISED 2026-07-23 per Ananth's clustering correction:**
```
score(theme) = w_p · prevalence_norm(theme) + w_l · lexicon_proximity(theme, query_tokens)
```
where:
- `theme` is a cluster of similar fanout_codes (e.g., "disability-related eligibility" contains eligibility.aged + eligibility.blind + eligibility.disability)
- `prevalence_norm(theme)` = sum of member_codes' doc counts, normalized within the fanout set
- `lexicon_proximity(theme, query_tokens)` = representative or summed overlap of query tokens vs union of member_codes' lexicon_entries phrases

**Proposed defaults (to be tuned via real eval runs):**
- `w_p = 0.4`, `w_l = 0.6` (lexicon_proximity weighted heavier, since it's query-specific)
- `MAX_FANOUT_THEMES = 4` (hard cap), target `N = 3` (top-3 themes typical, tunable)
- `lexicon_proximity` = Jaccard index or weighted phrase match over theme's member lexicon_entries
  (exact formula TBD in reformat.py, but should handle zero-overlap gracefully)
- Clustering mechanism: k-means vs. similarity-threshold agglomeration TBD at build time (either must produce ≤4 clusters by construction)

### Key tuning questions (test against real corpus, theme-level now)

1. **Does theme clustering collapse near-duplicate codes correctly?**
   - Test case reformat003 ("Eligibility for Medicaid") has ~80 individual codes
   - Clustering should produce ~4-5 distinct themes (e.g., "age-related", "disability-related", "income-related", "enrollment", "verification")
   - Expected behavior: codes like eligibility.aged + eligibility.blind + eligibility.disability should cluster into "disability-related eligibility" theme (one theme, one rewritten query)
   - Empirical measure: do the 80 codes cluster into ≤4 themes? Are the themes semantically coherent (human-interpretable)?
   - If themes are garbage (random code collections), the embedding/clustering mechanism needs work before proceeding
   - If themes are good, proceed to question 2

2. **Do top-3 themes capture the right breadth for user intents?**
   - With proper clustering, N=3 themes should cover the major user-intent angles for "eligibility"
   - Expected behavior: if a user query has hints (e.g., "eligibility for pregnant applicants"), that hint should boost the relevant theme's lexicon_proximity score
   - Empirical measure: if a query like "eligibility for pregnant applicants" is queried, does the "pregnancy-related" or "health-condition-related" theme rank in top-3 by hybrid score?
   - If prevalence dominates (generic themes like "income" always top-3, pregnancy theme never seen), raise `w_l` or lower `w_p`
   - If top-3 themes consistently capture the query's hints, N=3 is correct

3. **Does lexicon_proximity aggregate correctly across theme member_codes?**
   - When a query token (e.g., "hospice") matches lexicon entries in multiple theme member_codes, prevalence/proximity should bubble the theme up
   - Test case reformat005 is the main challenge: query "hospice services", fanout_codes include health_care_services.hospice + others
   - Expected: hospice-related theme should rank high (lexicon match), not drowned by generic-service themes (high prevalence but no lexicon match)
   - Empirical measure: run reformat005 with w_p=0.4/w_l=0.6, verify hospice theme is in top-3. If not, adjust weights
   - Also test edge case: bare query "health_care_services" (no hints) → ranking falls back to pure prevalence → top-3 are generic/common themes. That's correct, OR it's a Gate issue (should route to CLARIFY, not FAN_OUT)

4. **Is MAX_FANOUT_THEMES=4 (target N=3) still correct for huge fanout sets?**
   - Test case reformat005 has 50+ individual codes, clustering should reduce to ≤4 themes
   - N=3 is intentional "explore, don't explode" constraint (3× Pool latency per FAN_OUT, bounded by latency gate)
   - But if 50+ distinct user intents exist and compress only to 4 themes, N=3 might miss the 4th theme
   - Alternative: keep MAX=4 hard, but let N be adaptive (N=min(3, num_themes)) so small fanout sets don't pad
   - Empirical measure (downstream UX): do users ask follow-up clarifications on FAN_OUT results, suggesting top-3 missed their intent?
   - For now: MAX=4, target N=3 is the hypothesis; Eval owns measuring whether it holds

### Verification checklist (per test case run, theme-aware)
- [ ] Posture matches expected (PRECISE/FAN_OUT/CLARIFY/RELY_ON_EXTERNAL/DECLINE/CLARIFY_REPHRASE)
- [ ] Rewritten_query count matches expected (0 for RELY/DECLINE, 1 for PRECISE, 3 for FAN_OUT, 1+ for CLARIFY)
- [ ] For FAN_OUT cases:
  - [ ] Fanout_codes cluster into ≤4 themes by vector similarity (sanity check: are themes human-interpretable?)
  - [ ] Top-3 themes are ranked sensibly by hybrid score (lexicon hints boost theme score, not drowned by prevalence alone)
  - [ ] Each theme_member_codes list is non-empty and coherent (codes in a theme are semantically related)
  - [ ] One rewritten_query per theme (no duplicates, no orphaned codes outside themes)
- [ ] For CLARIFY cases: clarify_questions include plausible options from corpus patterns (not blind prompts)
- [ ] For RELY_ON_EXTERNAL cases: external_reason is either "vicinity" or "corpus_gap" (correct diagnosis)
- [ ] Reformat_ms is reasonable (all postures <100ms including live DB prevalence probes for FAN_OUT + embedding lookup for theme clustering)

---

## §7 Open for Eval tuning phase

Once reformat.py exists with theme clustering + scoring + tests pass, run these test cases against the live DB and corpus:

1. **Theme clustering validation (primary):** For each FAN_OUT test case, inspect the theme clusters:
   - Are themes semantically coherent (human-interpretable)?
   - Do near-duplicate codes (e.g., eligibility.aged + eligibility.blind) cluster together?
   - Are there any codes left outside themes (orphans)?
   - If clustering looks garbage, debug embedding pipeline or similarity threshold before proceeding

2. **Theme ranking validation (secondary, once clustering is good):**
   - Run queries in test cases reformat003/reformat005 against live fanout_codes
   - Verify top-3 themes are ranked sensibly (hybrid score, not pure prevalence)
   - If prevalence dominates (query "pregnancy" still puts generic themes top-3), adjust w_p/w_l and re-run
   - If lexicon matches are missing, check lexicon_proximity aggregation logic (summing across member_codes correctly?)

3. **Posture verification (global):** Verify all expected_posture values match actual output (PRECISE/FAN_OUT/CLARIFY/RELY/DECLINE all routing correctly)

4. **Tuning & finalization:**
   - If theme clustering is good but ranking needs tuning, adjust (w_p, w_l) incrementally (start w_p=0.4/w_l=0.6, measure top-3 theme capture rate)
   - If clustering is broken, this is a reformat.py build issue, not a tuning knob
   - Once tuning is complete, update this file with measured rankings + finalized (w_p, w_l) values
   - Post results to shape-reformat-simulation-tracker.md before TECH sign-off
