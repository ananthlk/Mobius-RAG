[project]
name = "mobius-rag"
version = "0.1.0"
description = "Eligibility RAG system"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "google-cloud-storage",
    "sqlalchemy",
    "asyncpg",
    "python-dotenv",
    "pymupdf",
    "greenlet",
    "aiohttp",
    "json-repair",
    "pyyaml",
    "beautifulsoup4",
    "google-api-python-client",
    "google-auth-oauthlib",
    "markdown>=3.5",
    "xhtml2pdf>=0.2.15",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "aiosqlite>=0.19",
]
openai = [
    "openai>=1.0",
]
vertex = [
    "google-cloud-aiplatform>=1.38",
]
chroma = [
    "chromadb>=0.4.0",
    # publish_sync._chat_pg_upsert_batch uses psycopg2 to write the
    # mobius_chat.published_rag_metadata row (sync lib, offloaded via
    # asyncio.to_thread). asyncpg can't talk to that DB because chat
    # owns the sync Alembic schema there.
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped, not function-scoped (TECH's fix, 2026-07-24, proven root
# cause): DB tests import AsyncSessionLocal's module-level connection pool,
# which outlives a per-function event loop -- a function-scoped loop
# closing while pooled connections are still bound to it produced "Event
# loop is closed" on the next test to check one out (cross-test/cross-file
# alternating failures, not a proxy issue). Session-scoped also matches
# production (one loop per process).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# TECH's P3 finding, 2026-07-24: a bare `testpaths = ["tests"]` silently
# collects zero of the in-package answer-engine tests (fillers, router,
# observer, contract, orchestrator dispatch, synthesis -- ~285 tests) since
# they live alongside their modules under app/services/, not under tests/.
# A plain `pytest` run looked "all green" while never running the whole
# new engine -- exactly the false-assurance failure mode the artifact-
# validation standard exists to catch.
testpaths = ["tests", "app/services/retriever", "app/services/router"]
pythonpath = ["."]
markers = [
    "integration: real DB + real Vertex calls, no mocks (see test_integration_production_shapes.py) -- real wall-clock cost, deliberately included in default collection (not hidden behind a flag) per the same testpaths-gap lesson above.",
]
